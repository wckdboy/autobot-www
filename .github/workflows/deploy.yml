name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.shots/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh release data and install mirror
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm data
          pnpm sync:install
      - run: pnpm build:all
      - run: node scripts/check-links.mjs
      - run: pnpm omnie:check
      - run: pnpm omnie:browser
      - run: pnpm projects:check
      - run: pnpm projects:browser
      - run: python3 -m unittest discover -s brand -p 'test_*.py'
      - run: node --test scripts/tinyrex-models.test.mjs scripts/browser-tools.test.mjs
      - run: node scripts/tinyrex-browser.mjs
      - run: node scripts/family-browser.mjs

      - name: Deploy autobot.sh
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && github.event_name != 'pull_request' }}
        run: npx --yes wrangler@4 deploy --config deploy/autobot.wrangler.jsonc

      - name: Deploy invincible.sh
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && github.event_name != 'pull_request' }}
        run: npx --yes wrangler@4 deploy --config deploy/invincible.wrangler.jsonc

      - name: Deploy sovware.io
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && github.event_name != 'pull_request' }}
        run: npx --yes wrangler@4 deploy --config deploy/sovware.wrangler.jsonc

      - name: Deploy wckd.ai
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && github.event_name != 'pull_request' }}
        run: npx --yes wrangler@4 deploy --config deploy/wckd.wrangler.jsonc

      - name: Cloudflare is not configured
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; the sites were built but not deployed."
          echo "Add both repository secrets, or run pnpm deploy locally after 'npx wrangler login'."
