name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:all
      - run: node scripts/check-links.mjs
      - run: pnpm omnie:check
      - run: pnpm omnie:browser
      - run: pnpm projects:check
      - run: pnpm projects:browser
      - run: python3 -m unittest discover -s brand -p 'test_*.py'
      - run: node --test scripts/tinyrex-models.test.mjs scripts/browser-tools.test.mjs
      - run: node scripts/tinyrex-browser.mjs
      - run: node scripts/family-browser.mjs
